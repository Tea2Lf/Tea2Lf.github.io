.combined-label { font-family:'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif; font-weight:400; font-size:clamp(.8rem,2.8vw,.9rem); color:#5f6c82; }

.divider { font-family:'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif; color:#3a4658; user-select:none; }
.future-block { margin-top:.4rem; padding-top:.9rem; border-top:1px solid #202836; width:100%; display:flex; flex-direction:column; gap:.55rem; }
.future-title { font-family:'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif; font-weight:400; font-size:clamp(.8rem,2.8vw,.9rem); color:#5f6c82; }
.future-list { display:flex; flex-wrap:wrap; gap:.6rem 1.4rem; list-style:none; }
.future-item { font-weight:700; font-size:clamp(1rem,3.2vw,1.2rem); color:#c7d8f2; letter-spacing:.03em; }

.grid-block {
  flex:1 1 auto; min-width:0;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  grid-template-rows:repeat(2, 1fr);

.mini-card {

.mini-body {

.article-links {

.article-links a {

  font-weight:400; font-size:clamp(.82rem,2.8vw,.95rem);

.article-links a:hover { color:#d6ecff; border-bottom-color:rgba(159,208,255,.5); }

.hero-spacer { width:100%; height:4.5rem; }
.hero::after { content:''; display:block; width:70px; height:1px; background:linear-gradient(90deg,rgba(140,180,240,.3),transparent); margin-top:2rem; opacity:.7; }

@media (max-width:900px) {

@media (max-width:640px) {

  .grid-block { gap:.6rem; grid-template-columns:1fr; }
  .mini-card { padding:.7rem .8rem .85rem; }
}

<script>
(function(){
  const toInt=(y,m,d)=>y*10000+m*100+d;

  function todayUTC8(){
    const d=new Date(Date.now()+8*3600*1000);
    return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),weekday:d.getUTCDay()};
  }
  function validDate(y,m,d){
    if(m<1||m>12||d<1||d>31)return false;
    const dm=[31,28,31,30,31,30,31,31,30,31,30,31];
    if((y%4===0&&y%100!==0)||y%400===0)dm[1]=29;
    return d<=dm[m-1];
  }
  function nextDay(y,m,d){
    const t=new Date(Date.UTC(y,m-1,d)); t.setUTCDate(t.getUTCDate()+1);
    return toInt(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate());
  }
  function splitInt(n){ return [Math.floor(n/10000),Math.floor(n%10000/100),n%100]; }

  function isPrime(n){
    if(!Number.isInteger(n)||n<2)return false;
    if(n===2||n===3)return true;
    if(n%2===0||n%3===0)return false;
    const lim=Math.floor(Math.sqrt(n));
    for(let i=5;i<=lim;i+=6) if(n%i===0||n%(i+2)===0)return false;
    return true;
  }
  const isSq=n=>{ if(n<1)return false; const r=Math.round(Math.sqrt(n)); return r*r===n; };
  function isMersenne(n){
    if(!isPrime(n))return false;
    const p=n+1; return (p&(p-1))===0&&p>1;
  }
  function isFermat(n){
    if(!isPrime(n))return false;
    const q=n-1; if(q<1||(q&(q-1))!==0)return false;
    const e=Math.log2(q); return Number.isInteger(e)&&(e&(e-1))===0&&e>=1;
  }

  function factorize(n){
    if(!Number.isInteger(n)||n<2)return '—';
    const parts=[];
    let x=n;
    for(let p=2;p*p<=x;p++){
      if(x%p===0){
        let cnt=0;
        while(x%p===0){x/=p;cnt++;}
        parts.push(cnt>1?p+'<sup>'+cnt+'</sup>':String(p));
      }
    }
    if(x>1) parts.push(String(x));
    return parts.join(' × ');
  }

  function attr(n){
    if(isFermat(n))   return {label:'费马素数',joke:'可以发论文了啊……'};
    if(isMersenne(n)) return {label:'梅森素数',joke:'大大吉！！！'};
    if(isPrime(n))    return {label:'素数',joke:'大吉的一天'};
    if(isSq(n))       return {label:'完全平方数',joke:'神秘的一天'};
    return {label:'合数',joke:'普通的一天'};
  }

  const MON=['Jan.','Feb.','Mar.','Apr.','May','Jun.','Jul.','Aug.','Sep.','Oct.','Nov.','Dec.'];
  const WD=['Su.','Mo.','Tu.','We.','Th.','Fr.','Sa.'];
  function ordinal(d){
    const m100=d%100;
    if(m100>=11&&m100<=13)return 'th';
    return d%10===1?'st':d%10===2?'nd':d%10===3?'rd':'th';
  }
  function tzLine2(o){ return MON[o.m-1]+' '+o.d+ordinal(o.d)+' '+WD[o.weekday]; }

  const t=todayUTC8();
  const ti=toInt(t.y,t.m,t.d);

  document.getElementById('todayDate').textContent=String(ti);
  document.getElementById('tzLine2').textContent=tzLine2(t);

  document.getElementById('factorization').innerHTML=factorize(ti);

  const a=attr(ti);
  document.getElementById('attrLabel').textContent=a.label;
  document.getElementById('attrJoke').textContent=a.joke;

  const list=document.getElementById('futureList');
  list.innerHTML='';
  let found=0, cy=t.y, cm=t.m, cd=t.d, guard=0;
  while(found<3&&guard<100000){
    guard++;
    const ni=nextDay(cy,cm,cd);
    [cy,cm,cd]=splitInt(ni);
    if(!validDate(cy,cm,cd))continue;
    if(isPrime(ni)){
      found++;
      const li=document.createElement('li');
      li.className='future-item'; li.textContent=String(ni);
      list.appendChild(li);
    }
  }
  if(found<3){
    const li=document.createElement('li');
    li.className='future-item'; li.textContent='——';
    list.appendChild(li);
  }
})();
</script>
